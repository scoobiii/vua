name: diagnose-performance-variance

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Number of benchmark repetitions per run
        required: false
        default: '10'
      iterations:
        description: Operations per repetition
        required: false
        default: '200'
      ref:
        description: Commit or branch to diagnose
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  diagnose:
    name: Measure local-crypto variance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run diagnostic repetitions
        env:
          REPETITIONS: ${{ inputs.repetitions }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          node scripts/diagnose-performance-variance.mjs \
            --repetitions "$REPETITIONS" \
            --iterations "$ITERATIONS" \
            --output /tmp/vua-performance-variance.json \
            --log /tmp/vua-performance-variance.log

      - name: Compare with signed baseline without changing it
        env:
          BASELINE_PATH: ci/baselines/vua-github-vm-x86_64.json
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/vua-performance-variance.json', 'utf8'));
          const baseline = JSON.parse(fs.readFileSync(process.env.BASELINE_PATH, 'utf8'));
          const expected = Number(baseline.metrics.throughput_ops_sec);
          const observed = report.summary.throughput_ops_sec;
          const result = {
            diagnostic_only: true,
            baseline_modified: false,
            baseline_ops_sec: expected,
            observed_median_ops_sec: observed.median,
            observed_min_ops_sec: observed.min,
            observed_max_ops_sec: observed.max,
            observed_mean_ops_sec: observed.mean,
            observed_standard_deviation_ops_sec: observed.standard_deviation,
            median_change_pct: Number((((observed.median - expected) / expected) * 100).toFixed(3)),
            baseline_id: baseline.baseline_id,
            baseline_commit: baseline.git.commit,
            diagnostic_commit: process.env.GITHUB_SHA,
          };
          fs.writeFileSync('/tmp/vua-performance-variance-summary.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Publish diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-variance-${{ github.run_id }}
          path: |
            /tmp/vua-performance-variance.json
            /tmp/vua-performance-variance.log
            /tmp/vua-performance-variance-summary.json
            ${{ env.BASELINE_PATH }}
          if-no-files-found: warn
