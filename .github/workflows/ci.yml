name: VUA CI — Execution Integrity

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  execution-integrity:
    name: Tests + execution evidence + mock gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Persist normalized lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize package lockfile"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- package-lock.json

      - name: Run execution-integrity gate
        run: npm run test:ci
        env:
          CI: "true"

      - name: Independently verify persisted ExecutionProof evidence
        if: always()
        run: npm run verify:evidence

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vua-execution-evidence
          path: |
            .vortex-evidence.json
            reports/execution-evidence/**
          if-no-files-found: error
