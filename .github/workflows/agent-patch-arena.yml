name: Agent Patch Arena — Benchmark Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [ main, develop ]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      auto_merge_winner:
        description: 'Auto-merge winning qualified patch if verdict is PASS_SUPERIOR or approved intent'
        type: boolean
        required: true
        default: false
      min_gain_threshold:
        description: 'Minimum delta gain over baseline score (e.g. 0.0 or 0.2)'
        type: number
        required: false
        default: 0.0

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  agent-tournament:
    name: Trusted benchmark comparison
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      # 1. Enforce Universal CI Subjection Rule (No bypass allowed)
      # INC-2026-09-20-ARENA-CI-DECOUPLING
      - name: Verify Universal CI Subjection Invariant
        id: ci_subjection
        uses: actions/github-script@v7
        with:
          script: |
            const requiredPrefixes = [
              'Lint, tests, build and attested performance gate',
              'Conformance, 100% Quality Gates',
              'Tests + execution evidence + mock gate',
            ];
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            });
            const notGreen = [];
            for (const prefix of requiredPrefixes) {
              const matches = data.check_runs.filter(c => c.name.startsWith(prefix) || c.name.includes(prefix));
              const ok = matches.some(c => c.status === 'completed' && c.conclusion === 'success');
              if (!ok) notGreen.push(prefix);
            }
            if (notGreen.length > 0) {
              core.warning('Universal CI Subjection: blocked — ' + notGreen.join('; '));
              core.setOutput('blocked', 'true');
            } else {
              core.info('All required gates green.');
              core.setOutput('blocked', 'false');
            }

      # 2. Derive Changed Files for Trusted Intent Classification
      - name: Derive Changed Files from Base
        id: diff_files
        run: |
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=50 || true
          CHANGED=$(git diff --name-only "$BASE_REF" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "CHANGED_FILES<<EOF" >> "$GITHUB_ENV"
          echo "$CHANGED" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "Detected changed files for intent classification:"
          echo "$CHANGED"

      # 3. Typecheck & Protocol Syntax Validation
      - name: Static Protocol Linting
        run: npm run lint

      # 4. Critical Gate: Canary Invariant Validation
      - name: Execute Canary Side-Effect & Security Invariants
        run: |
          echo "🐤 Running Canary Invariants Gate..."
          npx tsx scripts/test-canary.ts

      # 5. Patch Arena Policy Suite
      - name: Execute Patch Arena Intent & Policy Tests
        run: |
          echo "🧪 Running Patch Arena Intent Classification & Policy Tests..."
          npx tsx tests/patch-arena-policy.test.ts

      # 6. Darwinian Agent Arena Benchmark & Intent Gain Comparator
      - name: Run Patch Tournament Benchmark & Gain Comparator
        id: arena_eval
        run: |
          echo "🏆 Running Multi-Agent Patch Tournament with Intent-Aware Gain Intelligence..."
          npx tsx scripts/agent-patch-arena.ts > arena_output.txt 2>&1
          cat arena_output.txt

      # 7. Evaluate Intent-Aware Decision Gate for Auto-Merge
      - name: Evaluate Merge Decision Gate
        id: merge_gate
        run: |
          set -euo pipefail
          if grep -E -q "PASS_SUPERIOR|PASS_SECURITY|PASS_GOVERNANCE|PASS_CORRECTNESS" arena_output.txt \
             && [ "${{ steps.ci_subjection.outputs.blocked }}" != "true" ]; then
            echo "superior_found=true" >> "$GITHUB_OUTPUT"
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "✅ Arena PASS and CI subjection not blocked."
          else
            echo "superior_found=false" >> "$GITHUB_OUTPUT"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Auto-merge forbidden: Arena and/or CI subjection."
            exit 1
          fi

      # 8. Post Tournament Leaderboard & Gain Delta to PR Comments
      - name: Comment Arena Leaderboard & Decision on Pull Request
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = 'No arena output captured';
            if (fs.existsSync('arena_output.txt')) {
              output = fs.readFileSync('arena_output.txt', 'utf8');
            }
            const body = `### 🏆 Vortex Multi-Agent Patch Arena Results (VUA-SPEC-v2)\n\n\`\`\`text\n${output}\n\`\`\`\n\n*Evaluated by deterministic cryptographic CI gates with Intent-Aware Baseline Gain Comparator.*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      # 9. Protected path only (INC-2026-09-20: no git push origin main)
      - name: Auto-Merge Approved Winner (via protected path)
        if: ${{ steps.merge_gate.outputs.superior_found == 'true' && steps.ci_subjection.outputs.blocked != 'true' && (inputs.auto_merge_winner == true || contains(github.event.pull_request.labels.*.name, 'automerge-superior')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "🚀 Protected auto-merge only (no git push origin main)"
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto --squash \
            --match-head-commit "${{ github.event.pull_request.head.sha }}"

      # 10. Archive Verifiable Tournament Evidence
      - name: Archive Arena Cryptographic Evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-arena-evidence
          path: arena_output.txt
